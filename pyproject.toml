[project]
name = "eval-framework"
version = "0.18.3"
description = "Evaluation Framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [
  { name = "Aleph Alpha Research" }
]
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0.3,<7",
  "xmltodict>=1.0.4,<1.1",
  "pydantic>=2.14.1,<3",
  "datasets>=5.0.1,<6",
  "pycountry>=26.2.16,<27",
  "nltk>=3.10.3,<4",
  "python-dotenv>=1.2.4,<2",
  "lingua-language-detector>=2.2.0,<3",
  "google-crc32c>=1.9.0,<2",
  "langdetect>=1.0.9,<2", # required by the original ifeval implementation
  "jsonschema>=4.26.0,<5",
  "mysql-connector-python>=26.7.0,<27", # required for sql-related tasks
  "psycopg2-binary>=2.9.13,<3", # required for sql-related tasks
  "sympy>=1.14.0,<2",
  "llm-sandbox[docker]==0.3.46",
  "jsonlines>=4,<5",
  "lxml>=6.1.3,<7",
  "python-iso639>=2026.7.23",
  "wandb>=0.31.0,<1",
  "numpy>=2.5.4",
  # is a dependency of sympy, but not explicitly listed in the requirements.txt
  # https://github.com/sympy/sympy/blob/0204fa34e8f6f6f8ccb4de01209be9a2345c9d6e/doc/src/contributing/dependencies.md?plain=1#L125
  "antlr4-python3-runtime==4.11.0",
  "scipy>=1.18.1,<2",  # required for the aggregation of pass@k metrics
  "openai>=3.33.0,<4",
  "tiktoken>=0.14.0,<1",
  "transformers[chat-template]>=5.20.1,<6",
]

[project.optional-dependencies]
# Model-specific extras
determined = [
  "determined>=0.38.1,<0.39",
  "tensorboard==2.21.0"
]
all = [
  "eval_framework[determined]"
]

[project.urls]
repository = "https://github.com/Aleph-Alpha-Research/eval-framework"

[project.scripts]
eval_framework = "eval_framework.run:run"

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-mock>=3.16.0",
  "pytest-xdist>=3.8.0,<4",
  "pytest-sugar>1.1,<2",
  "types-pyyaml>=6.0.12.20260906,<7",
  "types-python-dateutil>=2.9.0.20260807,<3",
  "types-requests>=2.33.0.20261006,<3",
  "plotly>=7.1.0,<8",
  "ruff>=0.17.1",
  "pip-licenses>=5.5.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.13.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["eval_framework", "template_formatting"]

[tool.uv]
override-dependencies = [
  "requests>=2.32,<3",  # fix for determined
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # Pycodestyle Errors
    "F", # Pyflakes
    "UP", # Auto-upgrading of new Python features
    "I", # Sort imports
]

[tool.ruff.lint.isort]
# https://github.com/astral-sh/ruff-pre-commit/issues/121
# https://github.com/astral-sh/ruff/issues/10519
# wandb creates a folder called 'wandb' during local runs (not logged in)
# this needs to be added to prevent isort from incorrectly sorting
known-third-party = ["wandb"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
plugins = "pydantic.mypy"
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src", "utils"]

[tool.pytest.ini_options]
testpaths = ["./tests"]
minversion = 8.0
addopts = "-p 'no:legacypath' --doctest-modules -n auto"
markers = [
    "cpu_slow: runs for a long time (on CPU)",
    "slow_download: smoke tests that download large datasets (>15s); excluded from CI, run manually with -m slow_download",
    "external_api: needs external services for execution",
    "formatter_hash: formatter consistency tests using hash comparisons",
]
filterwarnings = [
    "ignore::DeprecationWarning:datasets.utils._dill:",
]
env = [
    "WANDB_MODE = disabled",
]
