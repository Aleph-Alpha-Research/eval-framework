name: Build & Deploy Sphinx Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "~=0.8.16"

      - name: Install project with docs dependencies
        run: uv sync --group docs

      - name: Autogenerate API docs
        working-directory: docs
        run: uv run --group docs sphinx-apidoc -o api/generated ../src/eval_framework

      - name: Build Sphinx docs
        working-directory: docs
        run: uv run --group docs sphinx-build -b html -j auto . _build/html

      - name: Deploy with ghp-import
        run: |
          uvx ghp-import@2.1.0 -n -p -f docs/_build/html \
            -m "Automated docs deploy" \
            -r origin \
            -b gh-pages
